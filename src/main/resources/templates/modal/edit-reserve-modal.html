<div xmlns:th="http://www.thymeleaf.org">
  <!-- Edit Reserve Modal -->
  <div id="editReserveModal" class="modal-backdrop" style="display: none">
    <div class="modal-container" role="dialog" aria-labelledby="editReserveModalTitle" aria-modal="true">
      <div class="modal-header">
        <h2 id="editReserveModalTitle">Editar Reserva</h2>
        <button class="modal-close" aria-label="Fechar modal" id="closeEditReserveModal">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="editReserveForm">
          <input type="hidden" id="editResModalReserveId" />

          <!-- Responsible (auto-filled from logged-in user, read-only) -->
          <div class="form-group required">
            <label for="editResResponsible">Responsável</label>
            <input type="text" id="editResResponsible" name="responsible" class="form-control" data-autofill-user required readonly style="background:#f8fafc;cursor:not-allowed;color:#334155;" />
            <div class="form-error">Responsável é obrigatório</div>
          </div>

          <!-- Requester (editable) -->
          <div class="form-group required">
            <label for="editResRequester">Solicitante</label>
            <input type="text" id="editResRequester" name="requester" class="form-control" required placeholder="Nome do solicitante" />
            <div class="form-error">Solicitante é obrigatório</div>
          </div>

          <!-- Requester email -->
          <div class="form-group">
            <label for="editResRequesterEmail">E-mail do Solicitante</label>
            <input type="email" id="editResRequesterEmail" name="requesterEmail" class="form-control" placeholder="email@exemplo.com" />
          </div>

          <!-- Solicitação link -->
          <div class="form-group">
            <label for="editResSolicitacaoLink">Link de Solicitação (E-mail)</label>
            <input type="text" id="editResSolicitacaoLink" name="solicitacaoLink" class="form-control" placeholder="https://mail.google.com/mail/u/2/#inbox/..." />
          </div>

          <!-- Date range -->
          <div class="form-group required">
            <label for="editResDataInicio">Data de Início</label>
            <input type="date" id="editResDataInicio" name="dataInicio" class="form-control" required />
            <div class="form-error">Data de início é obrigatória</div>
          </div>
          <div class="form-group required">
            <label for="editResDataFim">Data de Fim</label>
            <input type="date" id="editResDataFim" name="dataFim" class="form-control" required />
            <div class="form-error">Data de fim é obrigatória</div>
          </div>

          <!-- Tombamento search + add -->
          <div class="form-group required" style="margin-bottom: 0.5rem;">
            <label for="editResTombamentoInput">Adicionar Item (Tombamento)</label>
            <div style="display: flex; gap: 0.5rem; align-items: flex-start;">
              <div style="width: 80%; position: relative;">
                <input type="text" id="editResTombamentoInput" class="form-control" placeholder="Buscar por tombamento ou nome..." autocomplete="off" />
                <div id="editResTombamentoDropdown" style="display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; background: white; border: 1px solid #e2e8f0; border-radius: 4px; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);"></div>
              </div>
              <button type="button" class="btn btn-secondary" id="editResAddTombamentoBtn" style="width: 20%; padding: 0.5rem; text-align: center;">Adicionar</button>
            </div>
          </div>

          <!-- Item name preview -->
          <div class="form-group" style="margin-bottom: 0.5rem;">
            <label for="editResItemName">Nome do Item</label>
            <input type="text" id="editResItemName" class="form-control" disabled readonly placeholder="Nome do item aparecerá aqui" />
          </div>

          <!-- Selected items list -->
          <div class="form-group required">
            <label>Itens Selecionados</label>
            <div id="editResSelectedTombamentosContainer" style="min-height: 60px; max-height: 120px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.5rem; background: #f8fafc;">
              <ul id="editResSelectedItemsList" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.25rem;"></ul>
            </div>
            <div class="form-error">Pelo menos um item é obrigatório</div>
          </div>

        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelEditReserve">Cancelar</button>
        <button type="button" class="btn btn-primary" id="submitEditReserve">Salvar Alterações</button>
      </div>
    </div>
  </div>
</div>
