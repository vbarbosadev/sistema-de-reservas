<div xmlns:th="http://www.thymeleaf.org">
    <!-- Create Reserve Modal -->
    <div id="createReserveModal" class="modal-backdrop">
      <div class="modal-container" role="dialog" aria-labelledby="reserveModalTitle" aria-modal="true">
        <div class="modal-header">
          <h2 id="reserveModalTitle">Nova Reserva</h2>
          <button class="modal-close" aria-label="Fechar modal" id="closeReserveModal">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <form id="createReserveForm">

            <!-- STEP 1: Date range -->
            <div id="reserveDateSection">
              <div class="form-group required">
                <label for="reserveDataInicio">Data de Início</label>
                <input type="date" id="reserveDataInicio" name="dataInicio" required />
                <div class="form-error">Data de início é obrigatória</div>
              </div>
              <div class="form-group required">
                <label for="reserveDataFim">Data de Fim</label>
                <input type="date" id="reserveDataFim" name="dataFim" required />
                <div class="form-error">Data de fim é obrigatória</div>
              </div>
              <div class="form-group">
                <button type="button" class="btn btn-secondary" id="buscarItensDisponiveisBtn" style="width: 100%;">
                  Buscar Itens Disponíveis
                </button>
              </div>
            </div>

            <!-- STEP 2: Item selection (shown after dates are set) -->
            <div id="reserveItemSection" style="display: none;">
              <div class="form-group required" style="margin-bottom: 0.5rem;">
                <label for="reserveTombamentoInput">Item (Tombamento)</label>
                <div style="display: flex; gap: 0.5rem; align-items: flex-start;">
                  <div style="width: 80%; position: relative;">
                    <input type="text" id="reserveTombamentoInput" class="form-control" placeholder="Buscar por tombamento ou nome..." autocomplete="off" />
                    <div id="tombamentoDropdown" style="display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; background: white; border: 1px solid #e2e8f0; border-radius: 4px; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);"></div>
                  </div>
                  <button type="button" class="btn btn-secondary" id="addTombamentoBtn" style="width: 20%; padding: 0.5rem; text-align: center;">Adicionar</button>
                </div>
              </div>
              <div class="form-group" style="margin-bottom: 0.5rem;">
                <label for="reserveItemName">Nome do Item</label>
                <input type="text" id="reserveItemName" class="form-control" disabled readonly placeholder="Nome do item aparecerá aqui" />
              </div>
              <div class="form-group required">
                <label>Itens Selecionados</label>
                <div id="selectedTombamentosContainer" style="min-height: 60px; max-height: 120px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.5rem; background: #f8fafc;">
                  <ul id="selectedTombamentosList" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.25rem;"></ul>
                </div>
                <div class="form-error">Pelo menos um item é obrigatório</div>
              </div>
              <div class="form-group required">
                <label for="reserveResponsible">Responsável</label>
                <input type="text" id="reserveResponsible" name="responsible" data-autofill-user required readonly style="background:#f8fafc;cursor:not-allowed;color:#334155;" />
                <div class="form-error">Responsável é obrigatório</div>
              </div>
              <div class="form-group required">
                <label for="reserveRequester">Solicitante</label>
                <input type="text" id="reserveRequester" name="requester" required placeholder="Nome do solicitante" />
                <div class="form-error">Solicitante é obrigatório</div>
              </div>
              <div class="form-group">
                <label for="reserveSolicitacaoLink">Link de Solicitação (E-mail)</label>
                <input type="text" id="reserveSolicitacaoLink" name="solicitacaoLink" placeholder="https://mail.google.com/mail/u/2/#inbox/..." />
              </div>
            </div>

            <!-- Success animation (hidden by default) -->
            <div class="success-checkmark" style="display:none;">
              <div class="check-icon">
                <span class="icon-line line-tip"></span>
                <span class="icon-line line-long"></span>
                <div class="icon-circle"></div>
                <div class="icon-fix"></div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelReserve">Cancelar</button>
          <button type="button" class="btn btn-primary" id="submitReserve" style="display: none;">Criar Reserva</button>
        </div>
      </div>
    </div>
</div>
